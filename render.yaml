services:
  - type: web
    name: chotug-api
    runtime: node
    plan: starter
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chotug-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: rules
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: AI_VISION_MODEL
        value: qwen/qwen2.5-vl-72b-instruct:free

  - type: web
    name: chotug-web
    runtime: static
    plan: starter
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: pserv
    name: chotug-postgres
    plan: starter
    ipAllowList: []
