services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chotug
      POSTGRES_PASSWORD: chotug
      POSTGRES_DB: chotug_erp
    ports: ["5432:5432"]
    volumes:
      - chotug_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chotug -d chotug_erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://chotug:chotug@db:5432/chotug_erp
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      WEB_ORIGIN: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen/qwen2.5-vl-72b-instruct:free}
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./db:/app/db:ro

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  chotug_pgdata:
